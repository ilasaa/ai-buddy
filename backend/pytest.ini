[pytest]
pythonpath = .
testpaths = tests
addopts = --cov=app --cov-report=term-missing --cov-report=html --cov-report=json --cov-fail-under=80
markers =
    pgvector: PostgreSQL vector integration (requires migrated ai_buddy_test)
    local_model: opt-in real CPU embedding integration, no DeepSeek
